name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          
      - name: Configure CMake
        run: |
          mkdir -p build-web
          cd build-web
          emcmake cmake -G Ninja ..
          
      - name: Build
        run: |
          cd build-web
          cmake --build .
          
      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp bin/SpaceCadetPinball.html deploy/index.html
          cp bin/SpaceCadetPinball.js deploy/
          cp bin/SpaceCadetPinball.wasm deploy/
          cp bin/SpaceCadetPinball.data deploy/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
